<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAYDA Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css?v=4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 56'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop stop-color='%23C26BFF'/><stop offset='1' stop-color='%237C3AED'/></linearGradient></defs><path d='M4 10a6 6 0 0 1 6-6h14a18 18 0 0 1 0 36h-6v8a6 6 0 0 1-12 0z' fill='url(%23g)'/><circle cx='24' cy='22' r='7' fill='%23fff'/></svg>">
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="login-screen" class="login-wrap">
  <div class="login-art">
    <div class="brand big" data-logo></div>
    <h2>Управление лояльностью<br>и клиентами для бизнеса</h2>
    <div class="phone-art"><div class="phone-card"><span data-logo-mark></span></div></div>
  </div>
  <div class="login-side">
    <form class="login-card" id="login-form">
      <h1>Вход</h1>
      <p class="login-sub">Панель управления платформой Payda</p>
      <label>Телефон
        <input type="tel" id="login-phone" placeholder="+996700000001" autocomplete="username" required>
      </label>
      <label>Пароль
        <input type="password" id="login-password" autocomplete="current-password" required>
      </label>
      <div class="alert error" id="login-error" hidden></div>
      <button type="submit" class="btn primary wide lg" id="login-btn">Войти</button>
    </form>
  </div>
</div>

<!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
<div id="app" hidden>
  <aside class="sidebar">
    <a class="brand" href="#/dashboard" data-logo></a>
    <nav id="nav">
      <a href="#/dashboard" data-nav="dashboard"><i data-icon="home"></i><span>Главная</span></a>
      <a href="#/organizations" data-nav="organizations"><i data-icon="store"></i><span>Организации</span></a>
      <a href="#/users" data-nav="users"><i data-icon="user"></i><span>Клиенты</span></a>
      <a href="#/transactions" data-nav="transactions"><i data-icon="receipt"></i><span>Транзакции</span></a>
      <a href="#/statistics" data-nav="statistics"><i data-icon="bars"></i><span>Статистика</span></a>
      <a href="#/audit" data-nav="audit"><i data-icon="shield"></i><span>Аудит</span></a>
    </nav>
    <div class="sidebar-foot">
      <div class="avatar sm" id="who-avatar"></div>
      <div class="who">
        <strong id="who-name"></strong>
        <span>Администратор</span>
      </div>
      <button class="icon-btn light" id="logout-btn" title="Выйти" aria-label="Выйти"><i data-icon="logout"></i></button>
    </div>
  </aside>

  <main class="content">
    <div id="view"></div>
  </main>
</div>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="icon-btn" id="modal-close" aria-label="Закрыть"><i data-icon="x"></i></button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<div id="popover" class="popover" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="/app.js?v=4"></script>
</body>
</html>
